{% extends "base.html" %}
{% block title %}{{ title }} | Emin & Mila's Rentals{% endblock %}
{% block content %}
{% from "_icons.html" import icon %}
<section class="section wrap error-page">
  <span class="empty-icon">{{ icon('home', 26) }}</span>

  <h1>{{ title }}</h1>

  <a class="button" href="/properties">Browse available homes {{ icon('arrow-right', 16) }}</a>
</section>
{% endblock %}
